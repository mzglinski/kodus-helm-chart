---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 1
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  postgresql:
    parameters:
      # Primary must accept all PgBouncer session backends (1 pooler × default_pool_size)
      # plus replication/CNPG overhead. Sized for kind install tests, not production.
      max_connections: "100"
    extensions:
      - name: pgvector
        image:
          # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/pgvector
          reference: ghcr.io/cloudnative-pg/pgvector:0.8.6-18-trixie
  bootstrap:
    initdb:
      database: kodus_db
      owner: kodus
      secret:
        name: postgres-auth-secret
  storage:
    size: 1Gi
  affinity:
    enablePodAntiAffinity: false
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: postgres-pooler-rw
spec:
  cluster:
    name: postgres
  instances: 1
  type: rw
  pgbouncer:
    # Session mode is required for PostgreSQL session-level advisory locks
    # (pg_try_advisory_lock). Transaction pooling returns the server connection
    # after each statement while the lock stays on the old backend, so unlock
    # runs on a different session and locks leak until pg_terminate_backend.
    # Mirrors kodus-deployment terraform/modules/operators/postgresql/pooler.yaml.
    poolMode: session
    parameters:
      max_client_conn: "8192"
      # Session mode: one server backend per client for the session lifetime.
      # CI runs a single pooler with chart-testing replica counts — 50 is enough.
      default_pool_size: "50"
      reserve_pool_size: "5"
      # Appended by CNPG to extra_float_digits,options. Needed so clients that
      # send these as startup parameters (e.g. CrossProcessEventsBridge LISTEN
      # connections) are not rejected with FATAL 08P01.
      ignore_startup_parameters: "statement_timeout,idle_in_transaction_session_timeout"
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: kodus-db
spec:
  name: kodus_db
  owner: kodus
  cluster:
    name: postgres
  extensions:
    - name: vector
---
# MongoDB Community Operator workload identity (matches kodus-deployment operators).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mongodb-kubernetes-appdb
  labels:
    app.kubernetes.io/name: mongodb
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mongodb-kubernetes-appdb
  labels:
    app.kubernetes.io/name: mongodb
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [patch, delete, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mongodb-kubernetes-appdb
  labels:
    app.kubernetes.io/name: mongodb
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mongodb-kubernetes-appdb
subjects:
  - kind: ServiceAccount
    name: mongodb-kubernetes-appdb
    namespace: default
---
apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: mongodb
spec:
  members: 1
  type: ReplicaSet
  # renovate: datasource=docker depName=quay.io/mongodb/mongodb-community-server
  version: "8.0.12"
  security:
    authentication:
      modes: ["SCRAM"]
  users:
    - name: kodus
      db: admin
      passwordSecretRef:
        name: mongodb-auth-secret
        key: password
      roles:
        - name: readWrite
          db: kodus
        - name: dbAdmin
          db: kodus
      scramCredentialsSecretName: mongodb-kodus-scram
  statefulSet:
    spec:
      volumeClaimTemplates:
        - metadata:
            name: data-volume
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 1Gi
      template:
        spec:
          serviceAccountName: mongodb-kubernetes-appdb
          containers:
            - name: mongod
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  memory: 1Gi
            - name: mongodb-agent
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
---
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
spec:
  replicas: 1
  # renovate: datasource=docker depName=rabbitmq
  # rabbitmq_delayed_message_exchange requires RabbitMQ <4.3 (Mnesia removed in 4.3).
  image: rabbitmq:4.2.6-management
  rabbitmq:
    additionalPlugins:
      - rabbitmq_delayed_message_exchange
  secretBackend:
    externalSecret:
      name: rabbitmq-credentials
  override:
    statefulSet:
      spec:
        template:
          spec:
            initContainers:
              - name: download-delayed-plugin
                # renovate: datasource=docker depName=curlimages/curl
                image: curlimages/curl:8.21.0
                command:
                  - sh
                  - -c
                  - |
                    set -euo pipefail
                    curl -fsSL -o /plugins/rabbitmq_delayed_message_exchange.ez \
                      "https://github.com/rabbitmq/rabbitmq-delayed-message-exchange/releases/download/v4.2.0/rabbitmq_delayed_message_exchange-4.2.0.ez"
                    echo "f168b2c09810cde3726961d31f38e3408e6a7fbff3929908d6f962061d8e70a1  /plugins/rabbitmq_delayed_message_exchange.ez" | sha256sum -c -
                volumeMounts:
                  - name: community-plugins
                    mountPath: /plugins
            containers:
              - name: rabbitmq
                env:
                  - name: RABBITMQ_PLUGINS_DIR
                    value: /opt/rabbitmq/plugins:/community-plugins
                volumeMounts:
                  - name: community-plugins
                    mountPath: /community-plugins
            volumes:
              - name: community-plugins
                emptyDir: {}
